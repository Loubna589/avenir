# La veille bénévolat : chaque matin, GitHub lit le plan du site (sitemap) de JeVeuxAider.gouv.fr,
# ouvre les nouvelles missions (scripts/benevolat.py) et enregistre data/benevolat/ par un commit.
# Pas d identifiant à fournir : pages publiques, 10 s entre deux pages (Crawl-delay du robots.txt),
# 300 missions au plus par jour (environ 50 minutes).
name: veille-benevolat

on:
  schedule:
    - cron: "0 6 * * *"      # 6 h UTC, une heure après la veille France Travail
  workflow_dispatch:          # le bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

# Pas de groupe « commit-data » ici : la veille dure ~50 minutes et bloquerait les autres veilles.
# Elle n'écrit que dans data/benevolat/ : on réessaie simplement le push si un autre commit est passé avant.

jobs:
  benevolat:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lire les nouvelles missions de bénévolat
        run: python scripts/benevolat.py

      - name: Enregistrer la donnée du jour (commit + push)
        run: |
          git config user.name "veille-bot"
          git config user.email "actions@github.com"
          git add data/benevolat
          git commit -m "veille bénévolat : missions du $(date -u +%Y-%m-%d)" || { echo "rien de nouveau"; exit 0; }
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 20; done
